<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe - Google Style</title>
    <!-- Google Fonts: Google Sans & Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500;700;800&family=Roboto:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (v11) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, query, getDocs, arrayUnion } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseModule = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, query, getDocs, arrayUnion
        };
    </script>

    <style>
        :root {
            --google-blue: #4285F4;
            --google-blue-dark: #2B6CB0;
            --google-yellow: #FBBC05;
            --google-yellow-dark: #D9A000;
            --google-green: #34A853;
            --bg-color: #F8F9FA;
            --tile-bg: #FFFFFF;
            --tile-border: #E8EAED;
            --text-dark: #202124;
            --text-sub: #5F6368;
            --flat-gray-bg: #F1F3F4;
            --flat-gray-hover: #E8EAED;
            --radius-round: 999px;
            --radius-card: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Google Sans', 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        body {
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
        }

        .container {
            width: 100%;
            max-width: 360px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .top-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 4px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 1.5rem;
            font-weight: 800;
            user-select: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-header-flat {
            background-color: var(--flat-gray-bg);
            border: 1px solid var(--tile-border);
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: background-color 0.15s ease;
            position: relative;
        }

        .btn-header-flat:active {
            background-color: var(--flat-gray-hover);
        }

        .btn-header-flat img {
            width: 22px;
            height: 22px;
            object-fit: contain;
        }

        .online-status-badge {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--google-blue);
            background: transparent;
            border: none;
            display: none;
            text-align: center;
            width: 100%;
            letter-spacing: 0.5px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .board-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .board {
            display: grid;
            grid-gap: 8px;
            width: min(82vw, 310px);
            height: min(82vw, 310px);
            box-sizing: border-box;
        }

        .cell {
            background-color: var(--tile-bg);
            border: 1px solid var(--tile-border);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: background-color 0.12s ease;
        }

        .cell:active:not(.occupied) {
            background-color: var(--flat-gray-bg);
        }

        .cell.occupied {
            cursor: default;
        }

        .icon {
            width: 52%;
            height: 52%;
            display: block;
        }

        .cell.winning-cell {
            background-color: #E8F0FE;
            border-color: #D2E3FC;
        }

        .bottom-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding-bottom: 6px;
        }

        .turn-box-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .turn-card {
            background-color: var(--flat-gray-bg);
            color: #202124;
            border: 1px solid var(--tile-border);
            border-radius: 18px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            max-width: 200px;
            text-align: center;
            user-select: none;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .turn-text {
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        .scoreboard {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 8px;
        }

        .score-card {
            border-radius: 18px;
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            text-align: center;
            user-select: none;
            overflow: hidden;
            border: 1px solid transparent;
        }

        .score-card.x-card {
            background-color: var(--google-blue);
            color: #FFFFFF;
        }

        .score-card.ties-card {
            background-color: var(--flat-gray-bg);
            color: #202124;
            border-color: var(--tile-border);
        }

        .score-card.o-card {
            background-color: var(--google-yellow);
            color: #202124;
        }

        .score-title {
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            opacity: 0.9;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .score-num {
            font-size: 1.25rem;
            font-weight: 900;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(32, 33, 36, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            padding: 16px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: #FFFFFF;
            width: 100%;
            max-width: 320px;
            border-radius: var(--radius-card);
            box-shadow: 0 10px 30px rgba(0,0,0,0.25);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 85vh;
            overflow-y: auto;
            transform: translateY(20px) scale(0.95);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid #E8EAED;
            padding-bottom: 8px;
        }

        .modal-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-dark);
            text-align: center;
        }

        .setting-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-label {
            font-size: 0.68rem;
            font-weight: 800;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .option-group {
            display: flex;
            background-color: #F1F3F4;
            padding: 4px;
            border-radius: var(--radius-round);
            gap: 4px;
            flex-wrap: wrap;
        }

        .option-btn {
            flex: 1;
            padding: 8px 4px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-weight: 700;
            font-size: 0.7rem;
            border-radius: var(--radius-round);
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            white-space: nowrap;
        }

        .option-btn.active {
            background: var(--google-blue);
            color: #FFFFFF;
            box-shadow: 0 2px 6px rgba(66, 133, 244, 0.3);
        }

        .room-input-box {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .room-input {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid #DADCE0;
            border-radius: var(--radius-round);
            font-size: 0.82rem;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            outline: none;
            background: #F8F9FA;
        }

        .room-input:focus {
            border-color: var(--google-blue);
            background: #FFFFFF;
        }

        .btn-room-action {
            padding: 9px 12px;
            border: none;
            border-radius: var(--radius-round);
            background-color: var(--google-green);
            color: white;
            font-weight: 800;
            font-size: 0.72rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .btn-save {
            background-color: var(--google-blue);
            color: #FFFFFF;
            border: none;
            padding: 11px;
            border-radius: var(--radius-round);
            font-weight: 800;
            font-size: 0.82rem;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(66, 133, 244, 0.35);
            margin-top: 4px;
            transition: background-color 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-save:active {
            background-color: var(--google-blue-dark);
        }

        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 250px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 9px 12px;
            background-color: #F8F9FA;
            border-radius: 14px;
            border: 1px solid #E8EAED;
        }

        .leaderboard-item.top3 {
            background-color: #FEF7E0;
            border-color: #FCE8E6;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
            overflow: hidden;
        }

        .rank-badge {
            font-size: 0.78rem;
            font-weight: 900;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #E8EAED;
            color: var(--text-dark);
            flex-shrink: 0;
        }

        .rank-badge.rank-1 { background: var(--google-yellow); color: #202124; }
        .rank-badge.rank-2 { background: #BDC1C6; color: #202124; }
        .rank-badge.rank-3 { background: #E09A67; color: white; }

        .player-name {
            font-size: 0.78rem;
            font-weight: 700;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .win-count {
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--google-green);
            flex-shrink: 0;
        }

        /* Chat Styles */
        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 220px;
            overflow-y: auto;
            padding: 4px;
            background: #F8F9FA;
            border-radius: 14px;
            border: 1px solid #E8EAED;
        }

        .chat-bubble {
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.78rem;
            max-width: 85%;
            word-break: break-word;
        }

        .chat-bubble.mine {
            background-color: #E8F0FE;
            color: #174EA6;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-bubble.theirs {
            background-color: #FFFFFF;
            color: #202124;
            align-self: flex-start;
            border: 1px solid #E8EAED;
            border-bottom-left-radius: 2px;
        }

        .chat-sender {
            font-size: 0.65rem;
            font-weight: 800;
            margin-bottom: 2px;
            opacity: 0.8;
        }

        .chat-input-row {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .chat-input {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid #DADCE0;
            border-radius: var(--radius-round);
            font-size: 0.8rem;
            outline: none;
            background: #F8F9FA;
        }

        .chat-input:focus {
            border-color: var(--google-blue);
            background: #FFFFFF;
        }

        .notification-badge {
            position: absolute;
            top: -3px;
            right: -3px;
            background-color: #EA4335;
            color: white;
            font-size: 0.6rem;
            font-weight: 800;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
        }

        .username-input-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 2px;
        }

        .hidden {
            display: none !important;
        }

        @media (max-height: 600px) {
            body { padding: 6px 10px; }
            .container { gap: 6px; }
            .board { width: min(70vw, 240px); height: min(70vw, 240px); grid-gap: 6px; }
            .score-card { padding: 6px 2px; }
            .score-num { font-size: 1.05rem; }
            .btn-header-flat { width: 36px; height: 36px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header Atas -->
        <div class="top-header">
            <div class="logo-box">
                <span style="color: var(--google-blue);">X</span>
                <span style="color: var(--google-yellow);">O</span>
            </div>

            <div class="header-actions">
                <!-- Tombol Chat: CHAT.PNG -->
                <button class="btn-header-flat hidden" id="btnChatToggle" onclick="openChatModal()" title="Obrolan">
                    <img src="CHAT.PNG" alt="Chat" onerror="this.style.display='none'">
                    <span id="chatBadge" class="notification-badge hidden">0</span>
                </button>

                <!-- Tombol Peringkat: PIALA.PNG -->
                <button class="btn-header-flat" onclick="openLeaderboardModal()" title="Peringkat Global">
                    <img src="PIALA.PNG" alt="Piala" onerror="this.style.display='none'">
                </button>

                <!-- Tombol Pengaturan: GEAR.PNG -->
                <button class="btn-header-flat" onclick="openSettingsModal()" title="Pengaturan">
                    <img src="GEAR.PNG" alt="Pengaturan" onerror="this.style.display='none'">
                </button>

                <!-- Tombol Restart Game: MUATULANG.PNG -->
                <button class="btn-header-flat" onclick="resetGame()" title="Ulangi Game">
                    <img src="MUATULANG.PNG" alt="Ulangi" onerror="this.style.display='none'">
                </button>
            </div>
        </div>

        <!-- Badge Online -->
        <div id="onlineBadge" class="online-status-badge">
            ONLINE: ROOM <span id="onlineRoomCode">GLOBAL</span>
        </div>

        <div class="board-container">
            <div class="board" id="board"></div>
        </div>

        <div class="bottom-section">
            <div class="turn-box-container">
                <div class="turn-card">
                    <span class="turn-text" id="turnText">GILIRAN X</span>
                </div>
            </div>

            <div class="scoreboard">
                <div class="score-card x-card">
                    <span class="score-title" id="titleX">X (YOU)</span>
                    <span class="score-num" id="scoreX">0</span>
                </div>
                <div class="score-card ties-card">
                    <span class="score-title">SERI</span>
                    <span class="score-num" id="scoreDraw">0</span>
                </div>
                <div class="score-card o-card">
                    <span class="score-title" id="titleO">O (CPU)</span>
                    <span class="score-num" id="scoreO">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Pengaturan -->
    <div class="modal-overlay" id="settingsModalOverlay" onclick="handleOverlayClick(event, 'settings')">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title">Pengaturan Game</span>
            </div>

            <div class="setting-section username-input-box">
                <span class="setting-label">Nama Kamu</span>
                <input type="text" id="inputUsername" class="room-input" style="text-align:left; font-size:0.8rem; letter-spacing:0;" placeholder="Player123" maxlength="12">
            </div>

            <div class="setting-section">
                <span class="setting-label">Ukuran Papan</span>
                <div class="option-group" id="gridGroup">
                    <button class="option-btn active" onclick="setGrid(3)">3 x 3</button>
                    <button class="option-btn" onclick="setGrid(4)">4 x 4</button>
                    <button class="option-btn" onclick="setGrid(5)">5 x 5</button>
                </div>
            </div>

            <div class="setting-section">
                <span class="setting-label">Mode Permainan</span>
                <div class="option-group" id="modeGroup">
                    <button class="option-btn active" onclick="setMode('ai')">VS AI</button>
                    <button class="option-btn" onclick="setMode('pvp')">2 Pemain</button>
                    <button class="option-btn" onclick="setMode('global')">Cari Global</button>
                    <button class="option-btn" onclick="setMode('room')">Room Kode</button>
                </div>
            </div>

            <div class="setting-section hidden" id="roomSection">
                <span class="setting-label">Room Jarak Jauh</span>
                <div class="room-input-box">
                    <input type="text" id="inputRoomCode" class="room-input" placeholder="KODE" maxlength="6">
                    <button class="btn-room-action" onclick="joinOrCreateRoom()">Masuk</button>
                </div>
                <button class="btn-save" style="background-color: var(--google-green); margin-top: 4px; font-size: 0.72rem; padding: 7px;" onclick="generateRandomRoomCode()">
                    Buat Kode Room Baru
                </button>
            </div>

            <div class="setting-section" id="difficultySection">
                <span class="setting-label">Tingkat Kesulitan AI</span>
                <div class="option-group" id="difficultyGroup">
                    <button class="option-btn" onclick="setDifficulty('easy')">Mudah</button>
                    <button class="option-btn active" onclick="setDifficulty('medium')">Sedang</button>
                    <button class="option-btn" onclick="setDifficulty('hard')">Sulit</button>
                </div>
            </div>

            <button class="btn-save" style="width:100%; margin-top:6px;" onclick="applySettingsAndClose()">Simpan & Mainkan</button>
        </div>
    </div>

    <!-- Modal Papan Peringkat -->
    <div class="modal-overlay" id="leaderboardModalOverlay" onclick="handleOverlayClick(event, 'leaderboard')">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title">Peringkat Global Online</span>
            </div>

            <div class="leaderboard-list" id="leaderboardList">
                <div style="text-align:center; font-size:0.8rem; color:var(--text-sub); padding:16px;">Memuat Peringkat...</div>
            </div>

            <button class="btn-save" style="width:100%; margin-top:6px;" onclick="closeLeaderboardModal()">Tutup</button>
        </div>
    </div>

    <!-- Modal Chat Online -->
    <div class="modal-overlay" id="chatModalOverlay" onclick="handleOverlayClick(event, 'chat')">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title">Obrolan Lawan Main</span>
            </div>

            <div class="chat-messages" id="chatMessagesList">
                <div style="text-align:center; font-size:0.75rem; color:var(--text-sub); padding:12px;">Belum ada pesan. Sapa lawanmu!</div>
            </div>

            <div class="chat-input-row">
                <input type="text" id="inputChatMessage" class="chat-input" placeholder="Tulis pesan..." maxlength="60" onkeydown="if(event.key==='Enter') sendChatMessage()">
                <button class="btn-room-action" onclick="sendChatMessage()">Kirim</button>
            </div>

            <button class="btn-save" style="width:100%; margin-top:6px;" onclick="closeChatModal()">Tutup</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBHQ7-xkkXutGiDROuF2XbAfS99w0ywUG4",
            authDomain: "tictactoe-a3ff0.firebaseapp.com",
            projectId: "tictactoe-a3ff0",
            storageBucket: "tictactoe-a3ff0.firebasestorage.app",
            messagingSenderId: "385890088422",
            appId: "1:385890088422:web:2152bde74c97588f6dd227",
            measurementId: "G-KETZC6HSTJ"
        };
        const appId = "tictactoe-a3ff0";

        let persistentDeviceId = localStorage.getItem('tictactoe_device_id');
        if (!persistentDeviceId) {
            persistentDeviceId = 'user_' + Math.random().toString(36).substring(2, 10) + '_' + Date.now();
            localStorage.setItem('tictactoe_device_id', persistentDeviceId);
        }

        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'x') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'o') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.exponentialRampToValueAtTime(293.66, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const noteOsc = audioCtx.createOscillator();
                        const noteGain = audioCtx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(audioCtx.destination);
                        noteOsc.frequency.setValueAtTime(freq, now + i * 0.07);
                        noteGain.gain.setValueAtTime(0.08, now + i * 0.07);
                        noteGain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.12);
                        noteOsc.start(now + i * 0.07);
                        noteOsc.stop(now + i * 0.07 + 0.12);
                    });
                } else if (type === 'draw') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(200, now + 0.18);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now);
                    osc.stop(now + 0.18);
                }
            } catch (e) {}
        }

            const buttons = document.querySelectorAll(`${groupId} .option-btn`);
            buttons.forEach(btn => btn.classList.remove('active'));
            activeBtn.classList.add('active');
        }

        function generateWinningCombinations() {
            winningCombinations = [];
            const N = gridSize;
            const K = winCondition;

            for (let r = 0; r < N; r++) {
                for (let c = 0; c <= N - K; c++) {
                    let combo = [];
                    for (let k = 0; k < K; k++) combo.push(r * N + (c + k));
                    winningCombinations.push(combo);
                }
            }

            for (let c = 0; c < N; c++) {
                for (let r = 0; r <= N - K; r++) {
                    let combo = [];
                    for (let k = 0; k < K; k++) combo.push((r + k) * N + c);
                    winningCombinations.push(combo);
                }
            }

            for (let r = 0; r <= N - K; r++) {
                for (let c = 0; c <= N - K; c++) {
                    let combo = [];
                    for (let k = 0; k < K; k++) combo.push((r + k) * N + (c + k));
                    winningCombinations.push(combo);
                }
            }

            for (let r = 0; r <= N - K; r++) {
                for (let c = K - 1; c < N; c++) {
                    let combo = [];
                    for (let k = 0; k < K; k++) combo.push((r + k) * N + (c - k));
                    winningCombinations.push(combo);
                }
            }
        }

        function buildBoard() {
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            boardEl.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;

            boardState = Array(gridSize * gridSize).fill('');

            for (let i = 0; i < gridSize * gridSize; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.setAttribute('data-index', i);
                cell.addEventListener('click', () => handleCellClick(i));
                cell.addEventListener('touchstart', initAudio, { once: true });
                boardEl.appendChild(cell);
            }
        }

        function handleCellClick(index) {
            if (boardState[index] !== '' || !gameActive) return;

            if (gameMode === 'global' || gameMode === 'room') {
                if (currentPlayer !== myRole) return;
                makeOnlineMove(index);
                return;
            }

            makeMove(index, currentPlayer);

            if (gameActive && gameMode === 'ai' && currentPlayer === 'O') {
                setTimeout(() => {
                    makeAIMove();
                }, 200);
            }
        }

        function makeMove(index, player) {
            boardState[index] = player;
            const cell = boardEl.children[index];
            if (cell) {
                cell.innerHTML = player === 'X' ? svgX : svgO;
                cell.classList.add('occupied');
            }

            playSound(player.toLowerCase());

            if (checkWin(player)) {
                endGame(false, player);
            } else if (boardState.every(c => c !== '')) {
                endGame(true, null);
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                updateStatus();
            }
        }

        function updateStatus() {
            if (gameMode === 'global' || gameMode === 'room') {
                if (currentPlayer === myRole) {
                    turnText.innerText = 'GILIRANMU!';
                } else {
                    turnText.innerText = 'Lawan...';
                }
            } else {
                turnText.innerText = `GILIRAN ${currentPlayer}`;
            }
        }

        function checkWin(player) {
            return winningCombinations.some(combo => {
                const isWin = combo.every(idx => boardState[idx] === player);
                if (isWin) highlightWinningCells(combo);
                return isWin;
            });
        }

        function highlightWinningCells(combo) {
            combo.forEach(idx => {
                if (boardEl.children[idx]) {
                    boardEl.children[idx].classList.add('winning-cell');
                }
            });
        }

        function endGame(isDraw, winner) {
            gameActive = false;

            if (isDraw) {
                scores.draw++;
                scoreDrawEl.innerText = scores.draw;
                turnText.innerText = 'HASIL SERI!';
                playSound('draw');
            } else {
                scores[winner]++;
                if (winner === 'X') {
                    scoreXEl.innerText = scores.X;
                    turnText.innerText = 'X MENANG!';
                } else {
                    scoreOEl.innerText = scores.O;
                    turnText.innerText = 'O MENANG!';
                }
                playSound('win');
            }
        }

        function resetGame() {
            if (gameMode === 'global' || gameMode === 'room') {
                resetOnlineBoard();
                return;
            }
            gameActive = true;
            currentPlayer = 'X';
            buildBoard();
            updateStatus();
        }

        function resetScore() {
            scores = { X: 0, O: 0, draw: 0 };
            scoreXEl.innerText = '0';
            scoreOEl.innerText = '0';
            scoreDrawEl.innerText = '0';
        }

        function leaveOnlineRoom() {
            if (roomUnsubscribe) {
                roomUnsubscribe();
                roomUnsubscribe = null;
            }
            currentRoomId = null;
            onlineBadge.style.display = 'none';
            btnChatToggle.classList.add('hidden');
        }

        async function findGlobalMatch() {
            if (!db) return;
            leaveOnlineRoom();

            onlineBadge.style.display = 'block';
            onlineRoomCode.innerText = 'GLOBAL';
            turnText.innerText = 'Mencari...';
            btnChatToggle.classList.remove('hidden');

            const publicCol = window.FirebaseModule.collection(db, 'artifacts', appId, 'public', 'data', 'tic_tac_toe_rooms');
            const q = window.FirebaseModule.query(publicCol);
            const snapshot = await window.FirebaseModule.getDocs(q);

            let openRoom = null;
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                if (data.isGlobal && data.status === 'waiting' && data.gridSize === gridSize && data.playerX !== persistentDeviceId) {
                    openRoom = { id: docSnap.id, ...data };
                }
            });

            if (openRoom) {
                currentRoomId = openRoom.id;
                myRole = 'O';
                titleX.innerText = 'LAWAN (X)';
                titleO.innerText = 'ANDA (O)';

                const roomRef = window.FirebaseModule.doc(db, 'artifacts', appId, 'public', 'data', 'tic_tac_toe_rooms', currentRoomId);
                await window.FirebaseModule.updateDoc(roomRef, {
                    playerO: persistentDeviceId,
                    nameO: username,
                    status: 'playing'
                });

                subscribeToRoom(currentRoomId);
            } else {
                const newRoomId = 'G_' + Math.floor(100000 + Math.random() * 900000);
                currentRoomId = newRoomId;
                myRole = 'X';
                titleX.innerText = 'ANDA (X)';
                titleO.innerText = 'LAWAN (O)';

                const roomRef = window.FirebaseModule.doc(db, 'artifacts', appId, 'public', 'data', 'tic_tac_toe_rooms', currentRoomId);
                await window.FirebaseModule.setDoc(roomRef, {
                    isGlobal: true,
                    status: 'waiting',
                    gridSize: gridSize,
                    winCondition: winCondition,
                    playerX: persistentDeviceId,
                    nameX: username,
                    playerO: null,
                    nameO: null,
                    boardState: Array(gridSize * gridSize).fill(''),
                    currentPlayer: 'X',
                    winner: null,
                    chats: []
                });

                subscribeToRoom(currentRoomId);
            }
        }

        async function joinOrCreateRoom() {
            if (!db) return;
            const roomCode = inputRoomCode.value.trim().toUpperCase();
            if (!roomCode) return;

            leaveOnlineRoom();
            closeSettingsModal();

            currentRoomId = 'R_' + roomCode;
            const roomRef = window.FirebaseModule.doc(db, 'artifacts', appId, 'public', 'data', 'tic_tac_toe_rooms', currentRoomId);
            const roomSnap = await window.FirebaseModule.getDoc(roomRef);

            btnChatToggle.classList.remove('hidden');

            if (roomSnap.exists()) {
                const data = roomSnap.data();
                if (!data.playerO && data.playerX !== persistentDeviceId) {
                    myRole = 'O';
                    titleX.innerText = 'LAWAN (X)';
                    titleO.innerText = 'ANDA (O)';
                    await window.FirebaseModule.updateDoc(roomRef, {
                        playerO: persistentDeviceId,
                        nameO: username,
                        status: 'playing'
                    });
                } else {
                    myRole = data.playerX === persistentDeviceId ? 'X' : 'O';
                    titleX.innerText = myRole === 'X' ? 'ANDA (X)' : 'LAWAN (X)';
                    titleO.innerText = myRole === 'O' ? 'ANDA (O)' : 'LAWAN (O)';
                }
            } else {
                myRole = 'X';
                titleX.innerText = 'ANDA (X)';
                titleO.innerText = 'LAWAN (O)';
                await window.FirebaseModule.setDoc(roomRef, {
                    isGlobal: false,
                    roomCode: roomCode,
                    status: 'waiting',
                    gridSize: gridSize,
                    winCondition: winCondition,
                    playerX: persistentDeviceId,
                    nameX: username,
                    playerO: null,
                    nameO: null,
                    boardState: Array(gridSize * gridSize).fill(''),
                    currentPlayer: 'X',
                    winner: null,
                    chats: []
                });
            }

            onlineBadge.style.display = 'block';
            onlineRoomCode.innerText = roomCode;
            subscribeToRoom(currentRoomId);
        }

        let lastProcessedChatCount = 0;

        function subscribeToRoom(roomId) {
            const roomRef = window.FirebaseModule.doc(db, 'artifacts', appId, 'public', 'data', 'tic_tac_toe_rooms', roomId);

            roomUnsubscribe = window.FirebaseModule.onSnapshot(roomRef, (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();

                if (data.status === 'playing' && data.playerX && data.playerO) {
                    if ((myRole === 'X' && !data.playerO) || (myRole === 'O' && !data.playerX)) {
                        handleOpponentDisconnect(data.isGlobal);
                        return;
                    }
                }

                gridSize = data.gridSize;
                winCondition = data.winCondition;
                generateWinningCombinations();

                if (boardState.length !== data.boardState.length) {
                    buildBoard();
                }

                data.boardState.forEach((val, idx) => {
                    boardState[idx] = val;
                    const cell = boardEl.children[idx];
                    if (cell) {
                        if (val !== '') {
                            cell.innerHTML = val === 'X' ? svgX : svgO;
                            cell.classList.add('occupied');
                        } else {
                            cell.innerHTML = '';
                            cell.classList.remove('occupied', 'winning-cell');
                        }
                    }
                });

                currentPlayer = data.currentPlayer;
                gameActive = data.status === 'playing' || data.status === 'waiting';

                if (data.status === 'waiting') {
                    turnText.innerText = 'MENUNGGU LAWAN...';
                } else if (data.status === 'playing') {
                    updateStatus();
                }

                if (data.winner) {
                    gameActive = false;
                    if (data.winner === 'draw') {
                        turnText.innerText = 'HASIL SERI!';
                    } else {
                        const isIWin = data.winner === myRole;
                        turnText.innerText = isIWin ? 'KAMU MENANG!' : 'LAWAN MENANG!';
                        if (isIWin) {
                            recordGlobalWin();
                        }
                    }
                }

                if (data.chats && Array.isArray(data.chats)) {
                    renderChats(data.chats);
                    if (data.chats.length > lastProcessedChatCount) {
                        const latest = data.chats[data.chats.length - 1];
                        if (latest.senderId !== persistentDeviceId && !chatModalOverlay.classList.contains('active')) {
                            unreadChatCount++;
                            chatBadge.innerText = unreadChatCount;
                            chatBadge.classList.remove('hidden');
                        }
                        lastProcessedChatCount = data.chats.length;
                    }
                }
            });
        }

        function renderChats(chats) {
            if (chats.length === 0) {
                chatMessagesList.innerHTML = '<div style="text-align:center; font-size:0.75rem; color:var(--text-sub); padding:12px;">Belum ada pesan. Sapa lawanmu!</div>';
                return;
            }

            let html = '';
            chats.forEach(msg => {
                const isMine = msg.senderId === persistentDeviceId;
                const bubbleClass = isMine ? 'mine' : 'theirs';
                html += `
                    <div class="chat-bubble ${bubbleClass}">
                        <div class="chat-sender">${isMine ? 'Kamu' : (msg.senderName || 'Lawan')}</div>
                        <div>${escapeHtml(msg.text)}</div>
                    </div>
                `;
            });
            chatMessagesList.innerHTML = html;
            chatMessagesList.scrollTop = chatMessagesList.scrollHeight;
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        async function sendChatMessage() {
            if (!currentRoomId || !db) return;
            const text = inputChatMessage.value.trim();
            if (!text) return;

            inputChatMessage.value = '';
            const roomRef = window.FirebaseModule.doc(db, 'artifacts', appId, 'public', 'data', 'tic_tac_toe_rooms', currentRoomId);
            
            await window.FirebaseModule.updateDoc(roomRef, {
                chats: window.FirebaseModule.arrayUnion({
                    senderId: persistentDeviceId,
                    senderName: username,
                    text: text,
                    timestamp: Date.now()
                })
            });
        }

        async function handleOpponentDisconnect(isGlobal) {
            leaveOnlineRoom();
            if (isGlobal) {
                turnText.innerText = 'LAWAN KELUAR, MENCARI...';
                setTimeout(() => { findGlobalMatch(); }, 1500);
            } else {
                turnText.innerText = 'ROOM DIBUBARKAN!';
                setTimeout(() => {
                    gameMode = 'ai';
                    resetGame();
                }, 2000);
            }
        }

        async function makeOnlineMove(index) {
            boardState[index] = myRole;
            const nextTurn = myRole === 'X' ? 'O' : 'X';

            const roomRef = window.FirebaseModule.doc(db, 'artifacts', appId, 'public', 'data', 'tic_tac_toe_rooms', currentRoomId);

            let isWin = checkWin(myRole);
            let isDraw = !isWin && boardState.every(c => c !== '');

            let updatePayload = {
                boardState: boardState,
                currentPlayer: nextTurn
            };

            if (isWin) {
                updatePayload.winner = myRole;
                updatePayload.status = 'ended';
            } else if (isDraw) {
                updatePayload.winner = 'draw';
                updatePayload.status = 'ended';
            }

            await window.FirebaseModule.updateDoc(roomRef, updatePayload);
            playSound(myRole.toLowerCase());
        }

        async function resetOnlineBoard() {
            if (!currentRoomId || !db) return;
            const roomRef = window.FirebaseModule.doc(db, 'artifacts', appId, 'public', 'data', 'tic_tac_toe_rooms', currentRoomId);
            await window.FirebaseModule.updateDoc(roomRef, {
                boardState: Array(gridSize * gridSize).fill(''),
                currentPlayer: 'X',
                winner: null,
                status: 'playing'
            });
            buildBoard();
        }

        async function recordGlobalWin() {
            if (!db) return;
            const userLeaderboardRef = window.FirebaseModule.doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', persistentDeviceId);
            const userSnap = await window.FirebaseModule.getDoc(userLeaderboardRef);

            let currentWins = 0;
            if (userSnap.exists()) {
                currentWins = userSnap.data().wins || 0;
            }

            await window.FirebaseModule.setDoc(userLeaderboardRef, {
                username: username,
                wins: currentWins + 1,
                updatedAt: Date.now()
            });
        }

        async function fetchLeaderboard() {
            if (!db) return;
            leaderboardList.innerHTML = '<div style="text-align:center; font-size:0.8rem; color:var(--text-sub); padding:16px;">Memuat Peringkat...</div>';

            const leaderCol = window.FirebaseModule.collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            const q = window.FirebaseModule.query(leaderCol);
            const snapshot = await window.FirebaseModule.getDocs(q);

            let list = [];
            snapshot.forEach(docSnap => {
                list.push(docSnap.data());
            });

            list.sort((a, b) => b.wins - a.wins);

            if (list.length === 0) {
                leaderboardList.innerHTML = '<div style="text-align:center; font-size:0.8rem; color:var(--text-sub); padding:16px;">Belum ada peringkat online.</div>';
                return;
            }

            let html = '';
            list.slice(0, 10).forEach((item, idx) => {
                const rankClass = idx === 0 ? 'rank-1' : (idx === 1 ? 'rank-2' : (idx === 2 ? 'rank-3' : ''));
                const top3Class = idx < 3 ? 'top3' : '';

                html += `
                    <div class="leaderboard-item ${top3Class}">
                        <div class="player-info">
                            <span class="rank-badge ${rankClass}">${idx + 1}</span>
                            <span class="player-name">${item.username || 'Pemain'}</span>
                        </div>
                        <span class="win-count">${item.wins} Menang</span>
                    </div>
                `;
            });

            leaderboardList.innerHTML = html;
        }

        function makeAIMove() {
            if (!gameActive || currentPlayer !== 'O') return;
            let moveIndex;

            if (aiDifficulty === 'easy') {
                moveIndex = getRandomMove();
            } else if (aiDifficulty === 'medium') {
                moveIndex = Math.random() > 0.3 ? getHeuristicMove() : getRandomMove();
            } else {
                moveIndex = getHeuristicMove();
            }

            if (moveIndex !== null && moveIndex !== undefined && boardState[moveIndex] === '') {
                makeMove(moveIndex, 'O');
            } else {
                moveIndex = getRandomMove();
                if (moveIndex !== null) makeMove(moveIndex, 'O');
            }
        }

        function getRandomMove() {
            const avail = boardState.map((v, i) => v === '' ? i : null).filter(v => v !== null);
            if (avail.length === 0) return null;
            return avail[Math.floor(Math.random() * avail.length)];
        }

        function getHeuristicMove() {
            for (let i = 0; i < boardState.length; i++) {
                if (boardState[i] === '') {
                    boardState[i] = 'O';
                    if (checkWinningState('O')) {
                        boardState[i] = '';
                        return i;
                    }
                    boardState[i] = '';
                }
            }

            for (let i = 0; i < boardState.file_length; i++) {
                // ...
            }

            for (let i = 0; i < boardState.length; i++) {
                if (boardState[i] === '') {
                    boardState[i] = 'X';
                    if (checkWinningState('X')) {
                        boardState[i] = '';
                        return i;
                    }
                    boardState[i] = '';
                }
            }

            let bestScore = -Infinity;
            let bestMoves = [];

            for (let i = 0; i < boardState.length; i++) {
                if (boardState[i] === '') {
                    let score = evaluateCell(i);
                    if (score > bestScore) {
                        bestScore = score;
                        bestMoves = [i];
                    } else if (score === bestScore) {
                        bestMoves.push(i);
                    }
                }
            }

            return bestMoves.length > 0 ? bestMoves[Math.floor(Math.random() * bestMoves.length)] : getRandomMove();
        }

        function checkWinningState(player) {
            return winningCombinations.some(combo => combo.every(idx => boardState[idx] === player));
        }

        function evaluateCell(index) {
            let score = 0;
            const center = Math.floor((gridSize * gridSize) / 2);

            if (index === center) score += 5;

            winningCombinations.forEach(combo => {
                if (combo.includes(index)) {
                    let oCount = 0;
                    let xCount = 0;
                    combo.forEach(idx => {
                        if (boardState[idx] === 'O') oCount++;
                        if (boardState[idx] === 'X') xCount++;
                    });

                    if (xCount === 0) score += (oCount + 1) * 2;
                    if (oCount === 0) score += (xCount + 1);
                }
            });

            return score;
        }

        generateWinningCombinations();
        resetGame();
    </script>
