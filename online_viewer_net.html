<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tic Tac Toe - Google Style</title>
    <!-- Google Fonts: Google Sans & Roboto -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@500;700;800&family=Roboto:wght@500;700;900&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK (v11) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, query, where, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        window.FirebaseModule = {
            initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged,
            getFirestore, doc, setDoc, getDoc, collection, onSnapshot, updateDoc, query, where, getDocs, deleteDoc
        };
    </script>

    <style>
        :root {
            /* Warna khas Google */
            --google-blue: #4285F4;
            --google-blue-dark: #2B6CB0;
            --google-red: #EA4335;
            --google-yellow: #FBBC05;
            --google-yellow-dark: #D9A000;
            --google-green: #34A853;
            
            /* Background & Surface */
            --bg-color: #F8F9FA;
            --tile-bg: #E8EAED;
            --tile-shadow: #DADCE0;
            --text-dark: #202124;
            --text-sub: #5F6368;
            
            /* 3D Gray Button Surface */
            --3d-gray-bg: #BDC1C6;
            --3d-gray-shadow: #9AA0A6;
            
            --radius-round: 999px;
            --radius-card: 24px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Google Sans', 'Roboto', sans-serif;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: var(--bg-color);
        }

        body {
            color: var(--text-dark);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 14px 16px;
        }

        .container {
            width: 100%;
            max-width: 360px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        /* ===== 1. HEADER UTAMA ===== */
        .top-header {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 4px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 3px;
            font-size: 1.5rem;
            font-weight: 800;
            user-select: none;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Tombol Header Dengan Desain 3D Ala Kotak Seri */
        .btn-header-3d {
            background-color: var(--3d-gray-bg);
            box-shadow: inset 0 -4px 0 var(--3d-gray-shadow);
            border: none;
            width: 42px;
            height: 42px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.08s ease, box-shadow 0.08s ease, background-color 0.08s ease;
        }

        .btn-header-3d:active {
            transform: translateY(2px);
            box-shadow: inset 0 -2px 0 var(--3d-gray-shadow);
            background-color: #B0B4B9;
        }

        .btn-header-3d svg {
            width: 22px;
            height: 22px;
            fill: #202124;
        }

        /* Banner Status Online */
        .online-status-badge {
            font-size: 0.68rem;
            font-weight: 800;
            padding: 4px 12px;
            border-radius: var(--radius-round);
            background-color: #E8F0FE;
            color: var(--google-blue);
            border: 1px solid #D2E3FC;
            display: none;
            text-align: center;
            width: 100%;
        }

        /* ===== 2. PAPAN PERMAINAN ===== */
        .board-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            flex: 1;
        }

        .board {
            display: grid;
            grid-gap: 10px;
            width: min(82vw, 310px);
            height: min(82vw, 310px);
            box-sizing: border-box;
        }

        .cell {
            background-color: var(--tile-bg);
            box-shadow: inset 0 -4px 0 var(--tile-shadow);
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            user-select: none;
            position: relative;
            transition: background-color 0.12s ease;
        }

        .cell:active:not(.occupied) {
            background-color: #D2D6DC;
        }

        .cell.occupied {
            cursor: default;
        }

        .icon {
            width: 52%;
            height: 52%;
            display: block;
        }

        .cell.winning-cell {
            background-color: #E8F0FE;
            box-shadow: inset 0 -4px 0 #D2E3FC;
        }

        /* ===== 3. AREA BAWAH ===== */
        .bottom-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding-bottom: 6px;
        }

        .turn-box-container {
            width: 100%;
            display: flex;
            justify-content: center;
        }

        .turn-card {
            background-color: var(--3d-gray-bg);
            color: #202124;
            box-shadow: inset 0 -4px 0 var(--3d-gray-shadow);
            border-radius: 18px;
            padding: 8px 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: calc(33.33% - 7px);
            text-align: center;
            user-select: none;
            white-space: nowrap;
        }

        .turn-text {
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.4px;
            text-transform: uppercase;
        }

        /* Board Skor 3 Kolom */
        .scoreboard {
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-gap: 10px;
        }

        .score-card {
            border-radius: 18px;
            padding: 10px 4px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            text-align: center;
            user-select: none;
        }

        .score-card.x-card {
            background-color: var(--google-blue);
            color: #FFFFFF;
            box-shadow: inset 0 -4px 0 var(--google-blue-dark);
        }

        .score-card.ties-card {
            background-color: var(--3d-gray-bg);
            color: #202124;
            box-shadow: inset 0 -4px 0 var(--3d-gray-shadow);
        }

        .score-card.o-card {
            background-color: var(--google-yellow);
            color: #202124;
            box-shadow: inset 0 -4px 0 var(--google-yellow-dark);
        }

        .score-title {
            font-size: 0.65rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            opacity: 0.9;
        }

        .score-num {
            font-size: 1.25rem;
            font-weight: 900;
        }

        /* ===== 4. POPUP MODAL TERPISAH ===== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(32, 33, 36, 0.5);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background-color: #FFFFFF;
            width: 100%;
            max-width: 330px;
            border-radius: var(--radius-card);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            max-height: 88vh;
            overflow-y: auto;
            transform: translateY(20px) scale(0.95);
            transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .modal-overlay.active .modal-card {
            transform: translateY(0) scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: center;
            align-items: center;
            border-bottom: 1px solid #E8EAED;
            padding-bottom: 10px;
        }

        .modal-title {
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-dark);
            text-align: center;
        }

        .setting-section {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .setting-label {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .option-group {
            display: flex;
            background-color: #F1F3F4;
            padding: 4px;
            border-radius: var(--radius-round);
            gap: 4px;
            flex-wrap: wrap;
        }

        .option-btn {
            flex: 1;
            padding: 8px 6px;
            border: none;
            background: transparent;
            color: var(--text-sub);
            font-weight: 700;
            font-size: 0.72rem;
            border-radius: var(--radius-round);
            cursor: pointer;
            transition: all 0.15s ease;
            text-align: center;
            white-space: nowrap;
        }

        .option-btn.active {
            background: var(--google-blue);
            color: #FFFFFF;
            box-shadow: 0 2px 6px rgba(66, 133, 244, 0.3);
        }

        /* Input Kode Room Online */
        .room-input-box {
            display: flex;
            gap: 6px;
            margin-top: 4px;
        }

        .room-input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #DADCE0;
            border-radius: var(--radius-round);
            font-size: 0.85rem;
            font-weight: 700;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 2px;
            outline: none;
            background: #F8F9FA;
        }

        .room-input:focus {
            border-color: var(--google-blue);
            background: #FFFFFF;
        }

        .btn-room-action {
            padding: 10px 14px;
            border: none;
            border-radius: var(--radius-round);
            background-color: var(--google-green);
            color: white;
            font-weight: 800;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-save {
            background-color: var(--google-blue);
            color: #FFFFFF;
            border: none;
            padding: 12px;
            border-radius: var(--radius-round);
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(66, 133, 244, 0.35);
            margin-top: 4px;
            transition: background-color 0.15s ease;
        }

        .btn-save:active {
            background-color: var(--google-blue-dark);
        }

        /* ===== LEADERBOARD STYLING ===== */
        .leaderboard-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 280px;
            overflow-y: auto;
            padding-right: 2px;
        }

        .leaderboard-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 14px;
            background-color: #F8F9FA;
            border-radius: 14px;
            border: 1px solid #E8EAED;
        }

        .leaderboard-item.top3 {
            background-color: #FEF7E0;
            border-color: #FCE8E6;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .rank-badge {
            font-size: 0.8rem;
            font-weight: 900;
            width: 22px;
            height: 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #E8EAED;
            color: var(--text-dark);
        }

        .rank-badge.rank-1 { background: var(--google-yellow); color: #202124; }
        .rank-badge.rank-2 { background: #BDC1C6; color: #202124; }
        .rank-badge.rank-3 { background: #E09A67; color: white; }

        .player-name {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-dark);
        }

        .win-count {
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--google-green);
        }

        .username-input-box {
            display: flex;
            flex-direction: column;
            gap: 4px;
            margin-bottom: 2px;
        }

        .hidden {
            display: none !important;
        }

        /* Responsive Layout untuk Layar Kecil */
        @media (max-height: 600px) {
            body { padding: 8px 12px; }
            .container { gap: 8px; }
            .board { width: min(72vw, 250px); height: min(72vw, 250px); grid-gap: 8px; }
            .score-card { padding: 6px 2px; }
            .score-num { font-size: 1.1rem; }
            .btn-header-3d { width: 38px; height: 38px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 1. Header Atas -->
        <div class="top-header">
            <div class="logo-box">
                <span style="color: var(--google-blue);">X</span>
                <span style="color: var(--google-yellow);">O</span>
            </div>

            <!-- Action Buttons Header (3D) -->
            <div class="header-actions">
                <!-- Tombol Papan Peringkat (Tropi 3D) -->
                <button class="btn-header-3d" onclick="openLeaderboardModal()" title="Peringkat Global">
                    <svg viewBox="0 0 24 24">
                        <path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94A5.01 5.01 0 0 0 11 15.9V18H8v2h8v-2h-3v-2.1c2.12-.39 3.75-1.93 4.39-4.04C19.08 11.63 21 9.55 21 7V6c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z"/>
                    </svg>
                </button>

                <!-- Tombol Pengaturan (Gir 3D) -->
                <button class="btn-header-3d" onclick="openSettingsModal()" title="Pengaturan">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.31-.61-.22l-2.49 1c-.52-.39-1.06-.73-1.69-.98l-.38-2.65C13.43 2.17 13.2 2 12.95 2h-4c-.25 0-.48.17-.51.42l-.38 2.65c-.63.25-1.17.59-1.69.98l-2.49-1c-.22-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L3.5 10.5c-.04.34-.07.67-.07 1 0 .33.03.65.07.97l-2.11 1.66c-.19.15-.25.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1c.52.4 1.06.74 1.69.99l.38 2.65c.03.24.26.42.51.42h4c.25 0 .48-.18.51-.42l.38-2.65c.63-.25 1.17-.59 1.69-.99l2.49 1c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.66z"/>
                    </svg>
                </button>

                <!-- Tombol Restart Game (3D) -->
                <button class="btn-header-3d" onclick="resetGame()" title="Ulangi Game">
                    <svg viewBox="0 0 24 24">
                        <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Banner Informasi Mode Online -->
        <div id="onlineBadge" class="online-status-badge">
            ONLINE: ROOM <span id="onlineRoomCode">GLOBAL</span>
        </div>

        <!-- 2. Papan Permainan -->
        <div class="board-container">
            <div class="board" id="board"></div>
        </div>

        <!-- 3. Area Bawah -->
        <div class="bottom-section">
            <div class="turn-box-container">
                <div class="turn-card">
                    <span class="turn-text" id="turnText">GILIRAN X</span>
                </div>
            </div>

            <div class="scoreboard">
                <div class="score-card x-card">
                    <span class="score-title" id="titleX">X (YOU)</span>
                    <span class="score-num" id="scoreX">0</span>
                </div>
                <div class="score-card ties-card">
                    <span class="score-title">SERI</span>
                    <span class="score-num" id="scoreDraw">0</span>
                </div>
                <div class="score-card o-card">
                    <span class="score-title" id="titleO">O (CPU)</span>
                    <span class="score-num" id="scoreO">0</span>
                </div>
            </div>
        </div>
    </div>

    <!-- ===== 4A. MODAL POPUP PENGATURAN ===== -->
    <div class="modal-overlay" id="settingsModalOverlay" onclick="handleOverlayClick(event, 'settings')">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title">Pengaturan Game</span>
            </div>

            <!-- Nama Pemain -->
            <div class="setting-section username-input-box">
                <span class="setting-label">Nama Kamu</span>
                <input type="text" id="inputUsername" class="room-input" style="text-align:left; font-size:0.8rem; letter-spacing:0;" placeholder="Player123" maxlength="12">
            </div>

            <!-- 1. Pilihan Grid -->
            <div class="setting-section">
                <span class="setting-label">Ukuran Papan</span>
                <div class="option-group" id="gridGroup">
                    <button class="option-btn active" onclick="setGrid(3)">3 x 3</button>
                    <button class="option-btn" onclick="setGrid(4)">4 x 4</button>
                    <button class="option-btn" onclick="setGrid(5)">5 x 5</button>
                </div>
            </div>

            <!-- 2. Pilihan Mode Lawan -->
            <div class="setting-section">
                <span class="setting-label">Mode Permainan</span>
                <div class="option-group" id="modeGroup">
                    <button class="option-btn active" onclick="setMode('ai')">VS AI</button>
                    <button class="option-btn" onclick="setMode('pvp')">2 Pemain</button>
                    <button class="option-btn" onclick="setMode('global')">Cari Global</button>
                    <button class="option-btn" onclick="setMode('room')">Room Kode</button>
                </div>
            </div>

            <!-- Input Kode Room Online -->
            <div class="setting-section hidden" id="roomSection">
                <span class="setting-label">Kode Room Jarak Jauh</span>
                <div class="room-input-box">
                    <input type="text" id="inputRoomCode" class="room-input" placeholder="KODE" maxlength="6">
                    <button class="btn-room-action" onclick="joinOrCreateRoom()">Masuk</button>
                </div>
            </div>

            <!-- 3. Pilihan Kesulitan AI -->
            <div class="setting-section" id="difficultySection">
                <span class="setting-label">Tingkat Kesulitan AI</span>
                <div class="option-group" id="difficultyGroup">
                    <button class="option-btn" onclick="setDifficulty('easy')">Mudah</button>
                    <button class="option-btn active" onclick="setDifficulty('medium')">Sedang</button>
                    <button class="option-btn" onclick="setDifficulty('hard')">Sulit</button>
                </div>
            </div>

            <button class="btn-save" style="width:100%; margin-top:8px;" onclick="applySettingsAndClose()">Simpan & Mainkan</button>
        </div>
    </div>

    <!-- ===== 4B. MODAL POPUP PAPAN PERINGKAT ===== -->
    <div class="modal-overlay" id="leaderboardModalOverlay" onclick="handleOverlayClick(event, 'leaderboard')">
        <div class="modal-card">
            <div class="modal-header">
                <span class="modal-title">Peringkat Global Online</span>
            </div>

            <div class="leaderboard-list" id="leaderboardList">
                <div style="text-align:center; font-size:0.8rem; color:var(--text-sub); padding:16px;">Memuat Peringkat...</div>
            </div>

            <button class="btn-save" style="width:100%; margin-top:8px;" onclick="closeLeaderboardModal()">Tutup</button>
        </div>
    </div>

    <script>
        // Audio Synthesizer
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                const now = audioCtx.currentTime;

                if (type === 'x') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'o') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(587.33, now);
                    osc.frequency.exponentialRampToValueAtTime(293.66, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, i) => {
                        const noteOsc = audioCtx.createOscillator();
                        const noteGain = audioCtx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(audioCtx.destination);
                        noteOsc.frequency.setValueAtTime(freq, now + i * 0.07);
                        noteGain.gain.setValueAtTime(0.08, now + i * 0.07);
                        noteGain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.07 + 0.12);
                        noteOsc.start(now + i * 0.07);
                        noteOsc.stop(now + i * 0.07 + 0.12);
                    });
                } else if (type === 'draw') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(300, now);
                    osc.frequency.linearRampToValueAtTime(200, now + 0.18);
                    gain.gain.setValueAtTime(0.08, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.18);
                    osc.start(now);
                    osc.stop(now + 0.18);
                }
            } catch (e) {}
        }

        // Simbol SVG X dan O
        const svgX = `
            <svg class="icon" viewBox="0 0 40 40">
                <path d="M 8,8 L 32,32 M 32,8 L 8,32" stroke="#4285F4" stroke-width="7" stroke-linecap="round" />
            </svg>
        `;

        const svgO = `
            <svg class="icon" viewBox="0 0 40 40">
                <circle cx="20" cy="20" r="12" stroke="#FBBC05" stroke-width="7" fill="none" />
            </svg>
        `;

        // Modals Controls Terpisah
        const settingsModalOverlay = document.getElementById('settingsModalOverlay');
        const leaderboardModalOverlay = document.getElementById('leaderboardModalOverlay');

        function openSettingsModal() {
            settingsModalOverlay.classList.add('active');
        }

        function closeSettingsModal() {
            settingsModalOverlay.classList.remove('active');
        }

        function openLeaderboardModal() {
            leaderboardModalOverlay.classList.add('active');
            fetchLeaderboard();
        }

        function closeLeaderboardModal() {
            leaderboardModalOverlay.classList.remove('active');
        }

        function handleOverlayClick(e, modalType) {
            if (modalType === 'settings' && e.target === settingsModalOverlay) {
                closeSettingsModal();
            } else if (modalType === 'leaderboard' && e.target === leaderboardModalOverlay) {
                closeLeaderboardModal();
            }
        }

        function applySettingsAndClose() {
            saveUsername();
            closeSettingsModal();
            if (gameMode === 'global') {
                findGlobalMatch();
            } else if (gameMode !== 'room') {
                leaveOnlineRoom();
                resetGame();
            }
        }

        // Configurations & State
        let gridSize = 3;
        let winCondition = 3;
        let gameMode = 'ai';
        let aiDifficulty = 'medium';

        let boardState = [];
        let currentPlayer = 'X';
        let gameActive = true;
        let winningCombinations = [];
        let scores = { X: 0, O: 0, draw: 0 };

        // Firebase State
        let db = null;
        let auth = null;
        let user = null;
        let currentRoomId = null;
        let myRole = 'X';
        let roomUnsubscribe = null;
        let username = 'Pemain_' + Math.floor(100 + Math.random() * 900);

        // DOM Handles
        const boardEl = document.getElementById('board');
        const turnText = document.getElementById('turnText');
        const scoreXEl = document.getElementById('scoreX');
        const scoreOEl = document.getElementById('scoreO');
        const scoreDrawEl = document.getElementById('scoreDraw');
        const titleX = document.getElementById('titleX');
        const titleO = document.getElementById('titleO');
        const difficultySection = document.getElementById('difficultySection');
        const roomSection = document.getElementById('roomSection');
        const onlineBadge = document.getElementById('onlineBadge');
        const onlineRoomCode = document.getElementById('onlineRoomCode');
        const inputUsername = document.getElementById('inputUsername');
        const leaderboardList = document.getElementById('leaderboardList');

        // Init Firebase
        window.addEventListener('DOMContentLoaded', async () => {
            inputUsername.value = username;

            if (window.FirebaseModule && typeof __firebase_config !== 'undefined') {
                const firebaseConfig = JSON.parse(__firebase_config);
                const app = window.FirebaseModule.initializeApp(firebaseConfig);
                auth = window.FirebaseModule.getAuth(app);
                db = window.FirebaseModule.getFirestore(app);

                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await window.FirebaseModule.signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await window.FirebaseModule.signInAnonymously(auth);
                }

                window.FirebaseModule.onAuthStateChanged(auth, (u) => {
                    user = u;
                });
            }
        });

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';

        function saveUsername() {
            const val = inputUsername.value.trim();
            if (val) username = val;
        }

        // Selection Handlers
        function setGrid(size) {
            gridSize = size;
            winCondition = size === 3 ? 3 : 4;
            updateToggleUI('#gridGroup', event.target);
            generateWinningCombinations();
        }

        function setMode(mode) {
            gameMode = mode;
            updateToggleUI('#modeGroup', event.target);

            if (mode === 'ai') {
                difficultySection.classList.remove('hidden');
                roomSection.classList.add('hidden');
                titleX.innerText = 'X (YOU)';
                titleO.innerText = 'O (CPU)';
            } else if (mode === 'pvp') {
                difficultySection.classList.add('hidden');
                roomSection.classList.add('hidden');
                titleX.innerText = 'PEMAIN X';
                titleO.innerText = 'PEMAIN O';
            } else if (mode === 'global') {
                difficultySection.classList.add('hidden');
                roomSection.classList.add('hidden');
            } else if (mode === 'room') {
                difficultySection.classList.add('hidden');
                roomSection.classList.remove('hidden');
            }

            resetScore();
        }

        function setDifficulty(diff) {
            aiDifficulty = diff;
            updateToggleUI('#difficultyGroup', event.target);
        }

        function updateToggleUI(groupId, activeBtn) {
            const buttons = document.querySelectorAll(`${groupId} .option-btn`);
            buttons.forEach(btn => btn.classList.remove('active'));
            activeBtn.classList.add('active');
        }

        function generateWinningCombinations() {
            winningCombinations = [];
            const N = gridSize;
            const K = winCondition;

            for (let r = 0; r < N; r++) {
                for (let c = 0; c <= N - K; c++) {
                    let combo = [];
                    for (let k = 0; k < K; k++) combo.push(r * N + (c + k));
                    winningCombinations.push(combo);
                }
            }

            for (let c = 0; c < N; c++) {
                for (let r = 0; r <= N - K; r++) {
                    let combo = [];
                    for (let k = 0; k < K; k++) combo.push((r + k) * N + c);
                    winningCombinations.push(combo);
                }
            }

            for (let r = 0; r <= N - K; r++) {
                for (let c = 0; c <= N - K; c++) {
                    let combo = [];
                    for (let k = 0; k < K; k++) combo.push((r + k) * N + (c + k));
                    winningCombinations.push(combo);
                }
            }

            for (let r = 0; r <= N - K; r++) {
                for (let c = K - 1; c < N; c++) {
                    let combo = [];
                    for (let k = 0; k < K; k++) combo.push((r + k) * N + (c - k));
                    winningCombinations.push(combo);
                }
            }
        }

        function buildBoard() {
            boardEl.innerHTML = '';
            boardEl.style.gridTemplateColumns = `repeat(${gridSize}, 1fr)`;
            boardEl.style.gridTemplateRows = `repeat(${gridSize}, 1fr)`;

            boardState = Array(gridSize * gridSize).fill('');

            for (let i = 0; i < gridSize * gridSize; i++) {
                const cell = document.createElement('div');
                cell.classList.add('cell');
                cell.setAttribute('data-index', i);
                cell.addEventListener('click', () => handleCellClick(i));
                cell.addEventListener('touchstart', initAudio, { once: true });
                boardEl.appendChild(cell);
            }
        }

        function handleCellClick(index) {
            if (boardState[index] !== '' || !gameActive) return;

            if (gameMode === 'global' || gameMode === 'room') {
                if (currentPlayer !== myRole) return;
                makeOnlineMove(index);
                return;
            }

            makeMove(index, currentPlayer);

            if (gameActive && gameMode === 'ai' && currentPlayer === 'O') {
                setTimeout(() => {
                    makeAIMove();
                }, 200);
            }
        }

        function makeMove(index, player) {
            boardState[index] = player;
            const cell = boardEl.children[index];
            cell.innerHTML = player === 'X' ? svgX : svgO;
            cell.classList.add('occupied');

            playSound(player.toLowerCase());

            if (checkWin(player)) {
                endGame(false, player);
            } else if (boardState.every(c => c !== '')) {
                endGame(true, null);
            } else {
                currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
                updateStatus();
            }
        }

        function updateStatus() {
            if (gameMode === 'global' || gameMode === 'room') {
                if (currentPlayer === myRole) {
                    turnText.innerText = 'GILIRANMU!';
                } else {
                    turnText.innerText = 'Lawan...';
                }
            } else {
                turnText.innerText = `GILIRAN ${currentPlayer}`;
            }
        }

        function checkWin(player) {
            return winningCombinations.some(combo => {
                const isWin = combo.every(idx => boardState[idx] === player);
                if (isWin) highlightWinningCells(combo);
                return isWin;
            });
        }

        function highlightWinningCells(combo) {
            combo.forEach(idx => {
                if (boardEl.children[idx]) {
                    boardEl.children[idx].classList.add('winning-cell');
                }
            });
        }

        function endGame(isDraw, winner) {
            gameActive = false;

            if (isDraw) {
                scores.draw++;
                scoreDrawEl.innerText = scores.draw;
                turnText.innerText = 'HASIL SERI!';
                playSound('draw');
            } else {
                scores[winner]++;
                if (winner === 'X') {
                    scoreXEl.innerText = scores.X;
                    turnText.innerText = 'X MENANG!';
                } else {
                    scoreOEl.innerText = scores.O;
                    turnText.innerText = 'O MENANG!';
                }
                playSound('win');
            }
        }

        function resetGame() {
            if (gameMode === 'global' || gameMode === 'room') {
                resetOnlineBoard();
                return;
            }
            gameActive = true;
            currentPlayer = 'X';
            buildBoard();
            updateStatus();
        }

        function resetScore() {
            scores = { X: 0, O: 0, draw: 0 };
            scoreXEl.innerText = '0';
            scoreOEl.innerText = '0';
            scoreDrawEl.innerText = '0';
        }

        // ===== MULTIPLAYER ONLINE & LEADERBOARD (FIREBASE) =====
        function leaveOnlineRoom() {
            if (roomUnsubscribe) {
                roomUnsubscribe();
                roomUnsubscribe = null;
            }
            currentRoomId = null;
            onlineBadge.style.display = 'none';
        }

        async function findGlobalMatch() {
            if (!user || !db) return;
            leaveOnlineRoom();

            onlineBadge.style.display = 'block';
            onlineRoomCode.innerText = 'GLOBAL';
            turnText.innerText = 'Mencari...';

            const publicCol = window.FirebaseModule.collection(db, 'artifacts', appId, 'public', 'data', 'tic_tac_toe_rooms');
            const q = window.FirebaseModule.query(publicCol);
            const snapshot = await window.FirebaseModule.getDocs(q);

            let openRoom = null;
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                if (data.isGlobal && data.status === 'waiting' && data.gridSize === gridSize) {
                    openRoom = { id: docSnap.id, ...data };
                }
            });

            if (openRoom) {
                currentRoomId = openRoom.id;
                myRole = 'O';
                titleX.innerText = 'LAWAN (X)';
                titleO.innerText = 'ANDA (O)';

                const roomRef = window.FirebaseModule.doc(db, 'artifacts', appId, 'public', 'data', 'tic_tac_toe_rooms', currentRoomId);
                await window.FirebaseModule.updateDoc(roomRef, {
                    playerO: user.uid,
                    nameO: username,
                    status: 'playing'
                });

                subscribeToRoom(currentRoomId);
            } else {
                const newRoomId = 'G_' + Math.floor(100000 + Math.random() * 900000);
                currentRoomId = newRoomId;
                myRole = 'X';
                titleX.innerText = 'ANDA (X)';
                titleO.innerText = 'LAWAN (O)';

                const roomRef = window.FirebaseModule.doc(db, 'artifacts', appId, 'public', 'data', 'tic_tac_toe_rooms', currentRoomId);
                await window.FirebaseModule.setDoc(roomRef, {
                    isGlobal: true,
                    status: 'waiting',
                    gridSize: gridSize,
                    winCondition: winCondition,
                    playerX: user.uid,
                    nameX: username,
                    playerO: null,
                    nameO: null,
                    boardState: Array(gridSize * gridSize).fill(''),
                    currentPlayer: 'X',
                    winner: null
                });

                subscribeToRoom(currentRoomId);
            }
        }

        async function joinOrCreateRoom() {
            if (!user || !db) return;
            const roomCode = document.getElementById('inputRoomCode').value.trim().toUpperCase();
            if (!roomCode) return;

            leaveOnlineRoom();
            closeSettingsModal();

            currentRoomId = 'R_' + roomCode;
            const roomRef = window.FirebaseModule.doc(db, 'artifacts', appId, 'public', 'data', 'tic_tac_toe_rooms', currentRoomId);
            const roomSnap = await window.FirebaseModule.getDoc(roomRef);

            if (roomSnap.exists()) {
                const data = roomSnap.data();
                if (!data.playerO && data.playerX !== user.uid) {
                    myRole = 'O';
                    titleX.innerText = 'LAWAN (X)';
                    titleO.innerText = 'ANDA (O)';
                    await window.FirebaseModule.updateDoc(roomRef, {
                        playerO: user.uid,
                        nameO: username,
                        status: 'playing'
                    });
                } else {
                    myRole = data.playerX === user.uid ? 'X' : 'O';
                    titleX.innerText = myRole === 'X' ? 'ANDA (X)' : 'LAWAN (X)';
                    titleO.innerText = myRole === 'O' ? 'ANDA (O)' : 'LAWAN (O)';
                }
            } else {
                myRole = 'X';
                titleX.innerText = 'ANDA (X)';
                titleO.innerText = 'LAWAN (O)';
                await window.FirebaseModule.setDoc(roomRef, {
                    isGlobal: false,
                    roomCode: roomCode,
                    status: 'waiting',
                    gridSize: gridSize,
                    winCondition: winCondition,
                    playerX: user.uid,
                    nameX: username,
                    playerO: null,
                    nameO: null,
                    boardState: Array(gridSize * gridSize).fill(''),
                    currentPlayer: 'X',
                    winner: null
                });
            }

            onlineBadge.style.display = 'block';
            onlineRoomCode.innerText = roomCode;
            subscribeToRoom(currentRoomId);
        }

        function subscribeToRoom(roomId) {
            const roomRef = window.FirebaseModule.doc(db, 'artifacts', appId, 'public', 'data', 'tic_tac_toe_rooms', roomId);

            roomUnsubscribe = window.FirebaseModule.onSnapshot(roomRef, (docSnap) => {
                if (!docSnap.exists()) return;
                const data = docSnap.data();

                gridSize = data.gridSize;
                winCondition = data.winCondition;
                generateWinningCombinations();

                if (boardState.length !== data.boardState.length) {
                    buildBoard();
                }

                data.boardState.forEach((val, idx) => {
                    if (boardState[idx] !== val) {
                        boardState[idx] = val;
                        if (val !== '') {
                            const cell = boardEl.children[idx];
                            if (cell) {
                                cell.innerHTML = val === 'X' ? svgX : svgO;
                                cell.classList.add('occupied');
                            }
                        }
                    }
                });

                currentPlayer = data.currentPlayer;
                gameActive = data.status === 'playing' || data.status === 'waiting';

                if (data.status === 'waiting') {
                    turnText.innerText = 'MENUNGGU...';
                } else if (data.status === 'playing') {
                    updateStatus();
                }

                if (data.winner) {
                    gameActive = false;
                    if (data.winner === 'draw') {
                        turnText.innerText = 'HASIL SERI!';
                    } else {
                        const isIWin = data.winner === myRole;
                        turnText.innerText = isIWin ? 'KAMU MENANG!' : 'LAWAN MENANG!';
                        if (isIWin) {
                            recordGlobalWin();
                        }
                    }
                }
            });
        }

        async function makeOnlineMove(index) {
            boardState[index] = myRole;
            const nextTurn = myRole === 'X' ? 'O' : 'X';

            const roomRef = window.FirebaseModule.doc(db, 'artifacts', appId, 'public', 'data', 'tic_tac_toe_rooms', currentRoomId);

            let isWin = checkWin(myRole);
            let isDraw = !isWin && boardState.every(c => c !== '');

            let updatePayload = {
                boardState: boardState,
                currentPlayer: nextTurn
            };

            if (isWin) {
                updatePayload.winner = myRole;
                updatePayload.status = 'ended';
            } else if (isDraw) {
                updatePayload.winner = 'draw';
                updatePayload.status = 'ended';
            }

            await window.FirebaseModule.updateDoc(roomRef, updatePayload);
            playSound(myRole.toLowerCase());
        }

        async function resetOnlineBoard() {
            if (!currentRoomId || !db) return;
            const roomRef = window.FirebaseModule.doc(db, 'artifacts', appId, 'public', 'data', 'tic_tac_toe_rooms', currentRoomId);
            await window.FirebaseModule.updateDoc(roomRef, {
                boardState: Array(gridSize * gridSize).fill(''),
                currentPlayer: 'X',
                winner: null,
                status: 'playing'
            });
            buildBoard();
        }

        async function recordGlobalWin() {
            if (!user || !db) return;
            const userLeaderboardRef = window.FirebaseModule.doc(db, 'artifacts', appId, 'public', 'data', 'leaderboard', user.uid);
            const userSnap = await window.FirebaseModule.getDoc(userLeaderboardRef);

            let currentWins = 0;
            if (userSnap.exists()) {
                currentWins = userSnap.data().wins || 0;
            }

            await window.FirebaseModule.setDoc(userLeaderboardRef, {
                username: username,
                wins: currentWins + 1,
                updatedAt: Date.now()
            });
        }

        async function fetchLeaderboard() {
            if (!db) return;
            leaderboardList.innerHTML = '<div style="text-align:center; font-size:0.8rem; color:var(--text-sub); padding:16px;">Memuat Peringkat...</div>';

            const leaderCol = window.FirebaseModule.collection(db, 'artifacts', appId, 'public', 'data', 'leaderboard');
            const q = window.FirebaseModule.query(leaderCol);
            const snapshot = await window.FirebaseModule.getDocs(q);

            let list = [];
            snapshot.forEach(docSnap => {
                list.push(docSnap.data());
            });

            list.sort((a, b) => b.wins - a.wins);

            if (list.length === 0) {
                leaderboardList.innerHTML = '<div style="text-align:center; font-size:0.8rem; color:var(--text-sub); padding:16px;">Belum ada peringkat online.</div>';
                return;
            }

            let html = '';
            list.slice(0, 10).forEach((item, idx) => {
                const rankClass = idx === 0 ? 'rank-1' : (idx === 1 ? 'rank-2' : (idx === 2 ? 'rank-3' : ''));
                const top3Class = idx < 3 ? 'top3' : '';

                html += `
                    <div class="leaderboard-item ${top3Class}">
                        <div class="player-info">
                            <span class="rank-badge ${rankClass}">${idx + 1}</span>
                            <span class="player-name">${item.username || 'Pemain'}</span>
                        </div>
                        <span class="win-count">${item.wins} Menang</span>
                    </div>
                `;
            });

            leaderboardList.innerHTML = html;
        }

        // AI Logic
        function makeAIMove() {
            if (!gameActive) return;
            let moveIndex;

            if (aiDifficulty === 'easy') {
                moveIndex = getRandomMove();
            } else if (aiDifficulty === 'medium') {
                moveIndex = Math.random() > 0.4 ? getHeuristicMove() : getRandomMove();
            } else {
                moveIndex = getHeuristicMove();
            }

            if (moveIndex !== null && moveIndex !== undefined) {
                makeMove(moveIndex, 'O');
            }
        }

        function getRandomMove() {
            const avail = boardState.map((v, i) => v === '' ? i : null).filter(v => v !== null);
            if (avail.length === 0) return null;
            return avail[Math.floor(Math.random() * avail.length)];
        }

        function getHeuristicMove() {
            for (let i = 0; i < boardState.length; i++) {
                if (boardState[i] === '') {
                    boardState[i] = 'O';
                    if (checkWinningState('O')) {
                        boardState[i] = '';
                        return i;
                    }
                    boardState[i] = '';
                }
            }

            for (let i = 0; i < boardState.length; i++) {
                if (boardState[i] === '') {
                    boardState[i] = 'X';
                    if (checkWinningState('X')) {
                        boardState[i] = '';
                        return i;
                    }
                    boardState[i] = '';
                }
            }

            let bestScore = -Infinity;
            let bestMoves = [];

            for (let i = 0; i < boardState.length; i++) {
                if (boardState[i] === '') {
                    let score = evaluateCell(i);
                    if (score > bestScore) {
                        bestScore = score;
                        bestMoves = [i];
                    } else if (score === bestScore) {
                        bestMoves.push(i);
                    }
                }
            }

            return bestMoves.length > 0 ? bestMoves[Math.floor(Math.random() * bestMoves.length)] : getRandomMove();
        }

        function checkWinningState(player) {
            return winningCombinations.some(combo => combo.every(idx => boardState[idx] === player));
        }

        function evaluateCell(index) {
            let score = 0;
            const center = Math.floor((gridSize * gridSize) / 2);

            if (index === center) score += 5;

            winningCombinations.forEach(combo => {
                if (combo.includes(index)) {
                    let oCount = 0;
                    let xCount = 0;
                    combo.forEach(idx => {
                        if (boardState[idx] === 'O') oCount++;
                        if (boardState[idx] === 'X') xCount++;
                    });

                    if (xCount === 0) score += (oCount + 1) * 2;
                    if (oCount === 0) score += (xCount + 1);
                }
            });

            return score;
        }

        // Init
        generateWinningCombinations();
        resetGame();
    </script>
</body>
</html>
